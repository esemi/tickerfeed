name: tests

on: [push]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        pip install poetry
        poetry install

    - name: Run MyPy
      run: poetry run mypy app/

    - name: Run ruff
      run: poetry run ruff check app/ tests/

    - name: Run vulture
      run: poetry run vulture app/

    - name: Run tests
      run: poetry run pytest -ra -v --cov=app
      env:
        api_key: test
