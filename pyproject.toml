[tool.poetry]
name = "tickerfeed"
version = "0.1.0"
description = "GOOGLEFINANCE-like quotes API for Google Sheets with LSE/NYSE coverage"
authors = ["Simon <spam@esemi.ru>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = "^0.162.2"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
httpx = "^0.28.1"
redis = {extras = ["hiredis"], version = "^8.1.0"}
pydantic-settings = "^2.16.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
pytest-asyncio = "^1.4.1.post1"
pytest-cov = "^7.1.0"
respx = "^0.23.1"
fakeredis = "^2.40.0"
mypy = "^2.4.1"
ruff = "^0.17.4"
vulture = "^2.16"
pytest-mock = "^3.17.0"


[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # flake8-bugbear
    "C4",        # flake8-comprehensions
    "UP",        # pyupgrade
    "S",         # flake8-bandit
    "N",         # pep8-naming
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]           # assert в тестах — норма

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.vulture]
paths = ["app"]
min_confidence = 70

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
